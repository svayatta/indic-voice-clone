[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pratidhvani"
version = "0.1.0"
description = "Clone one Indic-language speaker from archival recordings with Svara-TTS and LoRA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["numpy", "soundfile", "librosa"]

[project.optional-dependencies]
tts = ["torch", "torchaudio", "transformers", "accelerate", "peft", "snac", "safetensors", "huggingface_hub", "audioseal"]
align = ["ctc-forced-aligner", "onnxruntime==1.20.1", "unidecode"]
speaker = ["torch", "torchaudio", "speechbrain"]
asr = ["torch", "torchaudio", "transformers"]
web = ["fastapi", "uvicorn", "python-multipart"]
all = ["pratidhvani[tts,align,speaker,asr,web]"]
dev = ["pytest", "httpx2", "pratidhvani[web]"]
# ClearerVoice pins numpy<2: install `clearvoice` in a separate environment
# and pass its python to `voiceclone prepare --enhance-python`.

[project.scripts]
voiceclone = "voiceclone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceclone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
